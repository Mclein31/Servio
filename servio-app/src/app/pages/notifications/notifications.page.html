<!-- notifications page -->
<ion-header class="ion-no-border"><ion-toolbar class="servio-detail-bar">
  <button type="button" slot="start" class="icon-btn" aria-label="Back" (click)="back()"><ion-icon name="arrow-back" aria-hidden="true"></ion-icon></button>
  <ion-title>Notifications</ion-title>
  @if (notifications.hasUnread()) {
    <button type="button" slot="end" class="text-btn mark-all" (click)="markAll()">Mark all read</button>
  }
</ion-toolbar></ion-header>
<ion-content class="servio-page">
  <ion-refresher slot="fixed" (ionRefresh)="pull($event)"><ion-refresher-content></ion-refresher-content></ion-refresher>
  <div class="wrap">
    @if (notifications.error()) { <p role="alert" class="error">{{ notifications.error() }}</p> }
    @for (item of notifications.items(); track item.id) {
      <button type="button" class="item" [class.unread]="!item.readAt" (click)="open(item)">
        <span class="kind" [style.color]="icons[item.kind].ink">
          <ion-icon [name]="icons[item.kind].icon" aria-hidden="true"></ion-icon>
        </span>
        <span class="text">
          <span class="title">{{ item.title }}</span>
          <span class="body">{{ item.body }}</span>
          <span class="time">{{ ago(item.createdAt) }}</span>
        </span>
        @if (!item.readAt) { <span class="dot" aria-label="Unread"></span> }
      </button>
    } @empty {
      @if (!notifications.loading()) {
        <div class="empty">
          <ion-icon name="notifications-outline" aria-hidden="true"></ion-icon>
          <h2>You're all caught up</h2>
          <p>Booking updates, messages and job requests will appear here.</p>
        </div>
      }
    }
  </div>
</ion-content>
