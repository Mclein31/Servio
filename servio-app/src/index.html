<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>SERVIO</title>

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#F8F9FA" />
  <style>
    .servio-preload { position: fixed; inset: 0; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff9f5; color: #111827; font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
    .servio-preload img { border-radius: 24px; box-shadow: 0 12px 36px #ff5c0026; }
    .servio-preload-name { margin-top: 22px; font-size: 30px; font-weight: 800; letter-spacing: .08em; }
    .servio-preload-tagline { margin-top: 10px; font-size: 14px; color: #6b7280; text-align: center; }
    .servio-preload-loader { margin-top: 40px; width: 36px; height: 36px; border: 4px solid #ff5c0026; border-top-color: #ff5c00; border-radius: 50%; animation: servio-load .8s linear infinite; }
    .servio-startup-wait { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8f9fa; color: #6b7280; font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; }
    @keyframes servio-load { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .servio-preload-loader { animation: none; } }
  </style>
</head>

<body>
  <app-root>
    <div class="servio-preload" role="status" aria-label="Loading SERVIO">
      <img src="assets/logo/servio_app_icon_orange.png" width="88" height="88" alt="" />
      <span class="servio-preload-name">SERVIO</span>
      <span class="servio-preload-tagline">Your neighborhood. Ready to help.</span>
      <span class="servio-preload-loader" aria-hidden="true"></span>
    </div>
  </app-root>
</body>

</html>
