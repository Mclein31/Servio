# SERVIO API — Cloudflare Workers + Hono (same setup as AdvanCare's backend).
# Secrets are NEVER committed. Local: copy .env.example to .env (in servio-api/).
# Deployed: `wrangler secret put <NAME> --env production` for every secret in .env.example.
name = "servio-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
LAUNCH_CITY = "tuguegarao"
UPLOADS_MODE = "local"
# Capacitor apps: iOS serves from capacitor://localhost, Android from http://localhost.
# In development any http://localhost:<port> is also allowed (see src/middleware/cors.ts).
ALLOWED_ORIGINS = "capacitor://localhost,http://localhost,https://localhost,http://localhost:8100"
R2_BUCKET_NAME = "servio-uploads-dev"

# Local development reaches Postgres/Neon directly through DATABASE_URL (servio-api/.env).
# Hyperdrive is bound only in deployed environments; see [env.production].

# Local simulated bucket until the real dev bucket exists. When it does, add `remote = true`
# so `wrangler dev` reads the same bucket presigned uploads write to.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "servio-uploads-dev"

# Sign-in codes: 10 requests/attempts per minute per IP and per email.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "2001"
simple = { limit = 10, period = 60 }

[[durable_objects.bindings]]
name = "ORDER_ROOMS"
class_name = "OrderRoom"

[[durable_objects.bindings]]
name = "GEOCODER"
class_name = "Geocoder"

[[migrations]]
tag = "servio-order-room-v1"
new_sqlite_classes = ["OrderRoom"]

[[migrations]]
tag = "servio-geocoder-v1"
new_sqlite_classes = ["Geocoder"]

[env.production]
name = "servio-api"
# Public API at https://servio-api.mcleinonza0531.workers.dev; no per-version preview URLs.
workers_dev = true
preview_urls = false
vars = { ENVIRONMENT = "production", LAUNCH_CITY = "tuguegarao", UPLOADS_MODE = "worker", ALLOWED_ORIGINS = "capacitor://localhost,http://localhost,https://localhost", R2_BUCKET_NAME = "servio-uploads" }

# Hyperdrive `servio-neon` → Neon project `servio`, branch production (direct URL, caching disabled).
[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "ccffcd0ef8644dc595f0bb59eff2bce4"

[[env.production.ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "2001"
simple = { limit = 10, period = 60 }

[[env.production.r2_buckets]]
binding = "UPLOADS"
bucket_name = "servio-uploads"

[[env.production.durable_objects.bindings]]
name = "ORDER_ROOMS"
class_name = "OrderRoom"

[[env.production.durable_objects.bindings]]
name = "GEOCODER"
class_name = "Geocoder"
